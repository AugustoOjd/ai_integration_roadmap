services:
  postgres:
    image: postgres:16
    environment:
      # ${VAR} sale del .env de al lado (Compose lo carga solo, sin env_file).
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Lado host configurable para poder tener varios minis a la vez.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Volumen nombrado: sobrevive a `down`, muere con `down -v`.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Sin esto, depends_on desbloquea cuando arranca el proceso, segundos
      # antes de que acepte queries.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 5

  app:
    build: .
    environment:
      # postgres:5432, no localhost — dentro de la red de Compose se llega por
      # el nombre del servicio y el puerto del contenedor.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        # service_healthy y no solo `- postgres`: init_db() corre al arrancar y
        # fallaría si Postgres aún no acepta conexiones.
        condition: service_healthy
    volumes:
      # Monta el código del host: editas y --reload recarga sin rebuild.
      # Quítalo para probar la imagen tal como se desplegaría.
      - ./app:/app/app
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
