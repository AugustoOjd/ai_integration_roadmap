[project]
name = "mini-6-celery-basics"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # El transporte de Celery se elige por extra: redis, rabbitmq, sqs...
    "celery[redis]>=5.5.3",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
