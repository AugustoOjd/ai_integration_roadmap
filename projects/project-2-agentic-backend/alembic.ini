[alembic]
script_location = alembic

# Sin esto, `from app.config import settings` en env.py falla: el ejecutable de
# alembic no tiene el directorio del proyecto en sys.path.
prepend_sys_path = .

# Las migraciones se prefijan con la fecha para que ordenen igual en el
# filesystem que en la cadena de revisiones.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# No hay sqlalchemy.url acá: la URL sale de app.config (y por lo tanto del .env)
# en alembic/env.py, para que no queden dos lugares con credenciales.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
