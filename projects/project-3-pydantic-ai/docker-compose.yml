services:
  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triage
      POSTGRES_DB: triage

    ports:
      # host:contenedor. 5433 afuera para no chocar con otro Postgres local.
      - "5433:5432"

    volumes:
      - p3_pgdata:/var/lib/postgresql/data

    healthcheck:
      # Sin esto `up -d --wait` vuelve antes de que acepte conexiones.
      test: ["CMD-SHELL", "pg_isready -U triage -d triage"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  p3_pgdata:
