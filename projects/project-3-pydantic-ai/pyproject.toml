[project]
name = "project-3-pydantic-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[anthropic,openai,mcp]>=2.46",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "logfire[sqlalchemy]",
    # El extra [mcp] trae sólo el cliente; el server de la fase 11 es nuestro.
    "fastmcp",
    "pydantic-evals>=2.46.0",
]

[tool.uv]
package = false
